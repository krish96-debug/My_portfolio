    <main class="contact">
      <section>
        <h2>Contact Information</h2>
        <p><i class="fa-solid fa-user"></i>Krishna Chaudhary</p>
        <p>
          <i class="fa-solid fa-paper-plane"></i>krishnachaudhary0225@gmail.com

      <section>
        <h2>Send Me a Message</h2>

        <form
          action="mailto:krishnachaudhary0225@gmail.com"
          method="post"
          enctype="text/plain"
        >
          <label>Your Name</label>
          <input type="text" name="name" placeholder="Your Name" required />

          <label>Your Email</label>
          <input type="email" name="email" placeholder="Your email" required />

          <label>Message</label>
          <textarea
            name="message"
            placeholder="Your Message"
            required
          ></textarea>

          <button type="submit" class="btn">Send</button>
        </form>
      </section>
